name: Secret Scan

# CI ini menggagalkan push/PR yang menyertakan rahasia agar kebocoran
# tertangkap lebih awal. PENGECUALIAN: key `fb_email_*` adalah shared relay
# key milik Freebuff (klarifikasi tim Freebuff, Sep 2026) — aman di repo,
# nothing to revoke. Jangan tambahkan rule yang mem-flag pola tersebut.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
