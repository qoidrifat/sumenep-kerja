name: Secret Scan

# CRIT-2 audit: API key sempat bocor ke git history & GitHub. CI ini
# menggagalkan push/PR yang menyertakan rahasia agar kejadian serupa
# tertangkap lebih awal. (Rotasi key + pemindahan ke env var sudah
# dilakukan di kode; rotate adalah satu-satunya perbaikan untuk history.)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
